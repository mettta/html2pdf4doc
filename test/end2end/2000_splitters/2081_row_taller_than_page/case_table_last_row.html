<!doctype html>
<html lang="">

<head>
  <meta charset="utf-8" />
  <meta name="keywords" content="HTML2PDF4DOC, end2end" />
  <meta name="description" content="HTML2PDF4DOC end2end test" />
  <title>Table: last row taller than a page</title>
  <link rel="stylesheet" href="../../../shared/css/main.css">
  <!-- No data-console-assert: the row is expected to overflow its page. -->
  <script
    defer
    data-debug-mode="true"
    data-markup-debug-mode="true"
    data-print-height='600px'
    data-print-width='600px'
    data-print-left-margin= '50px'
    data-print-right-margin= '50px'
    data-print-top-margin= '50px'
    data-print-bottom-margin= '50px'
    data-print-font-size='16px'
    src="../../../../dist/bundle.js"></script>
</head>
<style>
  body {
    margin: 0;
    padding: 0;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  td,
  .grid > div {
    border: 1px solid #006;
  }

</style>

<body>
  <!-- The last row has an explicit height: scaling cannot shrink it. -->
  <table>
    <tbody>
      <tr><td data-testid="row-1">Row 1</td></tr>
      <tr style="height: 900px"><td data-testid="row-2">Row 2 is taller than a page</td></tr>
    </tbody>
  </table>
  <p data-testid="closer">After the element.</p>
</body>

</html>
